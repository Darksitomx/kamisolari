[package]
name = "kamisolari"
version = "0.1.0"
edition = "2021"
description = "Rust con palabras clave en espanol. Traduce proyectos reales y compila con rustc."

[[bin]]
name = "kamisolari"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc_lexer = "0.1"
syn = { version = "2.0", features = ["full", "printing", "visit"] }
quote = "1.0"
